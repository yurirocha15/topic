# .github/workflows/release.yml

name: Build and Release

# Runs when a vX.Y.Z tag is pushed, or manually with a branch and a new vX.Y.Z tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        default: 'main'
        type: string
      version:
        description: 'Version tag to create (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}

jobs:
  # Stops the release early if the version is invalid or the code is not releasable.
  prepare:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch && format('refs/heads/{0}', inputs.branch) || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'pkg/go.mod'
          cache-dependency-path: 'pkg/go.sum'

      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.version || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Validates the tag format and that the changelog has notes for this version.
          scripts/release-notes.sh "$TAG" > /dev/null

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        working-directory: ./pkg
        run: go test ./...

  # Builds the binary for each architecture.
  build:
    name: Build for Linux (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'pkg/go.mod'
          cache-dependency-path: 'pkg/go.sum'

      - name: Build static binary
        working-directory: ./pkg
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          # IMPORTANT: Create a static binary for maximum compatibility (e.g., running on Alpine images).
          CGO_ENABLED: 0
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # -ldflags="-s -w" strips the binary to make it smaller.
          # -X main.Version=... injects the Git tag as a version string.
          go build -v -ldflags="-s -w -X main.Version=${TAG}" -o "../topic-${GOOS}-${GOARCH}" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: topic-linux-${{ matrix.arch }}
          path: topic-linux-${{ matrix.arch }}

  # Gathers the built artifacts and publishes them with the changelog notes.
  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          # The destination path for the downloaded artifacts.
          path: artifacts

      - name: Create release
        env:
          # The GITHUB_TOKEN is automatically provided by GitHub Actions.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          scripts/release-notes.sh "$TAG" > release-notes.md

          mkdir release
          cp artifacts/*/* release/
          (cd release && sha256sum topic-* > SHA256SUMS)

          # Creates the tag for manual runs. Tags made with GITHUB_TOKEN do not start this workflow again.
          gh release create "$TAG" release/* --target "$SHA" --title "$TAG" --notes-file release-notes.md
